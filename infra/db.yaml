AWSTemplateFormatVersion: '2010-09-09'
Description: kb-mcp database stack (RDS PostgreSQL with pgvector, private subnets, reachable only from instances in DbClientSg). Automated backups (7 days by default), deletion protection, and a final snapshot when the stack deletes or replaces the database. A sandbox reset still loses all of it; the laptop copy (infra/up.sh save) is the backup that survives (docs/RECOVERY.md).

Parameters:
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedPattern: '^db\.[a-z0-9]+\.[a-z0-9]+$'
    Description: RDS instance class. The probe (infra/probe-rds.sh) lists the classes this sandbox offers.

  EngineVersion:
    Type: String
    Default: '16.9'
    AllowedPattern: '^[0-9]+\.[0-9]+$'
    Description: PostgreSQL version. 16.9 matches the pgvector/pgvector:pg16 image the tests use.

  MultiAz:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: A standby in the other Availability Zone. Set false only if the sandbox refuses it.

  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 64
    AllowedPattern: '^[A-Za-z0-9]+$'
    ConstraintDescription: 16 to 64 letters and digits.
    Description: Master password. No default; infra/deploy.sh db reads it from KB_DB_PASSWORD.

  StorageEncrypted:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Encrypt the storage. KMS is list only in the sandbox, so false is the fallback if the create is refused.

  BackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: Days of automated backups (point-in-time restore window). 7 by default (phase 25.5); lower it only if the sandbox refuses it.

  DeletionProtection:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Refuse DeleteDBInstance while true, so a stray delete-stack fails instead of dropping the database. infra/teardown-db.sh turns it off right before a deliberate delete.

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: kb-mcp database, private subnets in two Availability Zones
      SubnetIds:
        - !ImportValue kb-PrivateSubnetA
        - !ImportValue kb-PrivateSubnetB
      Tags:
        - Key: Project
          Value: kb-mcp

  # Empty on purpose: it only marks the app instances. The app stack attaches it
  # (phase 21) and DbSg lets exactly this group reach the database.
  DbClientSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Attach to instances that may connect to the kb database
      VpcId: !ImportValue kb-VpcId
      Tags:
        - Key: Name
          Value: kb-db-client
        - Key: Project
          Value: kb-mcp

  DbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from kb-db-client only
      VpcId: !ImportValue kb-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt DbClientSg.GroupId
          Description: PostgreSQL from instances in kb-db-client
      Tags:
        - Key: Name
          Value: kb-db
        - Key: Project
          Value: kb-mcp

  # Recovery layers (docs/RECOVERY.md): automated backups for point-in-time
  # restore, a final snapshot whenever CloudFormation deletes or replaces the
  # instance (Snapshot policies), deletion protection against a stray delete, and
  # the S3 export plus the laptop copy, which alone survive a sandbox reset.
  # Final snapshots are kept until someone deletes them (aws rds delete-db-snapshot,
  # allowed in the lab, 2026-11-08) or the sandbox is reset; each costs snapshot
  # storage for the data it holds.
  # W1011: the password is a NoEcho parameter, not a dynamic reference, because the
  # sandbox does not list Secrets Manager and the instances cannot read SSM.
  Db:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W1011
    Properties:
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      DBName: kb
      MasterUsername: kbadmin
      MasterUserPassword: !Ref DbPassword
      AllocatedStorage: '20'
      StorageType: gp2
      StorageEncrypted: !Ref StorageEncrypted
      MultiAZ: !Ref MultiAz
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DbSg.GroupId
      BackupRetentionPeriod: !Ref BackupRetentionDays
      # 06:00 to 06:30 UTC, before the nightly export-sqlite at 07:15 UTC.
      PreferredBackupWindow: '06:00-06:30'
      # Must not overlap the backup window; Sunday 08:00 to 08:30 UTC.
      PreferredMaintenanceWindow: 'sun:08:00-sun:08:30'
      CopyTagsToSnapshot: true
      DeletionProtection: !Ref DeletionProtection
      Tags:
        - Key: Project
          Value: kb-mcp

Outputs:
  DbEndpoint:
    Description: Database host name (private; reachable from DbClientSg only)
    Value: !GetAtt Db.Endpoint.Address
    Export:
      Name: kb-DbEndpoint
  DbPort:
    Description: Database port
    Value: !GetAtt Db.Endpoint.Port
    Export:
      Name: kb-DbPort
  DbInstanceId:
    Description: RDS instance identifier (CloudWatch DBInstanceIdentifier dimension, teardown and restore)
    Value: !Ref Db
    Export:
      Name: kb-DbInstanceId
  DbClientSg:
    Description: Security group the app instances attach to reach the database
    Value: !GetAtt DbClientSg.GroupId
    Export:
      Name: kb-DbClientSg
