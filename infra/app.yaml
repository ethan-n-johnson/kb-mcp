AWSTemplateFormatVersion: '2010-09-09'
Description: kb-mcp app stack (NAT gateway, ALB, CloudFront, launch template, Auto Scaling group, alarms). Billed by the hour, safe to delete between sessions.

Parameters:
  ImageTag:
    Type: String
    Description: Tag of the kb-mcp image tarball in S3 (s3://<bucket>/images/kb-mcp-<tag>.tar.gz, uploaded by infra/push-image.sh, which prints the tag). Changing it replaces the instance (rolling update). Images expire after 30 days.
    AllowedPattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
    ConstraintDescription: A valid Docker tag (letters, digits, underscore, dot, dash; max 128 characters).
  InstanceType:
    Type: String
    Default: t3.medium
    Description: EC2 instance type for the app server.
  InstanceProfileName:
    Type: String
    Default: myS3Role
    Description: Existing instance profile for the app instances (the sandbox cannot create IAM roles). It must allow S3 on the data bucket; nothing else is required (deviation 8 in docs/PROGRESS.md). In the Cloud Architecting 3 sandbox myS3Role (S3 only) is the one profile the lab user may pass to an instance (EMR_EC2_DefaultRole is denied by iam:PassRole), so the search metrics and the CloudWatch agent cannot publish there. Learner Lab has LabInstanceProfile. infra/deploy.sh reads it from KB_INSTANCE_PROFILE.
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,128}$'
    ConstraintDescription: An IAM instance profile name.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 AMI, resolved from the public SSM parameter when the stack is created or updated.
  CloudFrontPrefixListId:
    Type: String
    Description: ID of the CloudFront origin-facing managed prefix list (com.amazonaws.global.cloudfront.origin-facing), recorded in phase 00. The ALB accepts port 80 only from it. infra/deploy.sh reads it from KB_CLOUDFRONT_PREFIX_LIST_ID.
    AllowedPattern: '^pl-[0-9a-f]{8,17}$'
    ConstraintDescription: A managed prefix list ID such as pl-3b927c52.
  AlertEmail:
    Type: String
    Description: Address that receives the CloudWatch alarm emails (confirm the SNS subscription from the inbox). infra/deploy.sh reads it from KB_ALERT_EMAIL.
    AllowedPattern: '^[^@\s,;]+@[^@\s,;]+\.[^@\s,;]+$'
    ConstraintDescription: A single email address.
  MetricsMode:
    Type: String
    Default: 'off'
    AllowedValues:
      - 'off'
      - emf
      - api
    Description: How the app publishes search metrics (KB_METRICS_MODE). off publishes nothing and starts no sender (the default, because the sandbox instance role cannot publish metrics, deviation 8, so the KbMcp alarms stay without data). api sends them with put_metric_data, which only works with an instance role that allows it. emf writes Embedded Metric Format log lines, which only become metrics when the container logs reach CloudWatch Logs; the sandbox role cannot write there, so emf is only for an environment that adds that back (deviation 8).
  ExtensionOrigin:
    Type: String
    Default: ''
    AllowedPattern: '^(chrome-extension://[a-p]{32})?$'
    ConstraintDescription: Empty (no CORS headers at all) or chrome-extension:// followed by the 32 letter extension ID.
    Description: Origin of the Chrome capture extension (KB_EXTENSION_ORIGIN), the only origin CORS allows on the API. Leave empty to send no CORS headers. infra/deploy.sh reads it from KB_EXTENSION_ORIGIN. The pattern keeps the value safe to place in the user data shell script.

  DatabaseMode:
    Type: String
    Default: sqlite
    AllowedValues:
      - sqlite
      - postgres
    Description: Where the knowledge base lives. sqlite (default until phase 22) keeps the database on the instance root volume, snapshotted to S3 after every write. postgres uses the RDS instance of the kb-db stack (which must exist; the instance joins kb-DbClientSg), reads the connection URL from s3://<bucket>/config/database-url, and on an empty database imports snapshots/kb-latest.db.gz at boot. infra/deploy.sh reads it from KB_DATABASE_MODE.

  SearchRate:
    Type: String
    Default: 120/minute
    AllowedPattern: '^[0-9]+/(second|minute|hour|day)$'
    ConstraintDescription: A rate such as 120/minute (a number, a slash and second, minute, hour or day).
    Description: Search rate limit per client address (KB_SEARCH_RATE), 120/minute by default so a class behind one campus NAT shares a workable budget. It is counted per instance, so with several instances (postgres mode) the effective limit is this value times the instance count. Admission control, not this limit, protects the instances from overload; raise it far above the default only for a load test. infra/deploy.sh reads it from KB_SEARCH_RATE.

Conditions:
  UsePostgres: !Equals [!Ref DatabaseMode, postgres]
  # KbMcp and CWAgent metrics need a role that may publish them (not myS3Role).
  PublishesMetrics: !Not [!Equals [!Ref MetricsMode, 'off']]

# Group size per DatabaseMode. A table (FindInMap) rather than Fn::If because
# CloudFormation documents Ref and FindInMap, but not Fn::If, inside CreationPolicy.
# Never raise Max above 4: the sandbox suspends the account past 9 instances.
Mappings:
  Capacity:
    sqlite:
      Min: '1'
      Max: '1'
      Desired: '1'
      InService: 0
      Signals: 1
    postgres:
      Min: '2'
      Max: '4'
      Desired: '2'
      InService: 1
      Signals: 2

Resources:
  # ---------------------------------------------------------------- Networking
  # The NAT gateway lives here (not in kb-network) so deleting kb-app removes
  # the hourly charge. The route below is added to the imported private route table.
  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: kb-nat-eip
        - Key: Project
          Value: kb-mcp

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !ImportValue kb-PublicSubnetA
      Tags:
        - Key: Name
          Value: kb-nat
        - Key: Project
          Value: kb-mcp

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !ImportValue kb-PrivateRouteTableId
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  # ---------------------------------------------------------- Security groups
  # The ALB is reachable only through CloudFront: port 80 from the CloudFront
  # origin-facing managed prefix list and nothing else. A prefix list counts
  # as one rule per entry against the security group rule quota; if an update
  # fails on a quota, that is why.
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: kb-mcp ALB, HTTP from CloudFront only
      VpcId: !ImportValue kb-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: HTTP from the CloudFront origin-facing prefix list
      Tags:
        - Key: Name
          Value: kb-alb-sg
        - Key: Project
          Value: kb-mcp

  # No port 22. Use Session Manager for a shell.
  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: kb-mcp app instances, port 8000 from the ALB only
      VpcId: !ImportValue kb-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSg
          Description: App port from the ALB
      Tags:
        - Key: Name
          Value: kb-app-sg
        - Key: Project
          Value: kb-mcp

  # ------------------------------------------------------------ Load balancer
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      # Explicit so the relationship with uvicorn's --timeout-keep-alive (75, Dockerfile)
      # is visible: the target must keep idle connections open longer than this.
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '60'
      SecurityGroups:
        - !Ref AlbSg
      Subnets:
        - !ImportValue kb-PublicSubnetA
        - !ImportValue kb-PublicSubnetB
      Tags:
        - Key: Name
          Value: kb-alb
        - Key: Project
          Value: kb-mcp

  # The health check is liveness (/livez, phase 25.3): the process answers HTTP.
  # It must not depend on the database: with HealthCheckType ELB on the group, a
  # database outage or RDS failover would otherwise mark every instance unhealthy
  # at once and the group would replace them all. Readiness (/healthz: database
  # readable, counts, model status) gates the boot signal in the user data and
  # stays the diagnostic endpoint.
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue kb-VpcId
      Protocol: HTTP
      Port: 8000
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /livez
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Name
          Value: kb-tg
        - Key: Project
          Value: kb-mcp

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # --------------------------------------------------------------- CloudFront
  # HTTPS for viewers on the default *.cloudfront.net certificate; the hop to
  # the ALB is plain HTTP (known limitation, docs/PLAN.md "Auth and security").
  #
  # The managed policy IDs below come from docs/phases/10-cloudfront.md. They
  # were NOT re-verified with `aws cloudfront list-cache-policies --type managed`
  # and `aws cloudfront list-origin-request-policies --type managed` because
  # there was no AWS access when this was written. Verify them before the
  # first deploy.
  #   CachingDisabled           4135ea2d-6df8-44a3-9df3-4b5a84be39ad
  #   CachingOptimized          658327ea-f89d-4fab-a63d-7e88639e58f6
  #   AllViewerExceptHostHeader b689b0a8-53d0-40ab-baf2-68738e2966ac
  #
  # AllViewerExceptHostHeader forwards every viewer header, Authorization
  # included, and query strings. The explicit /api/* and /mcp* behaviors repeat
  # the default behavior on purpose: they make "never cached" visible here.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - Key: Name
          Value: kb-cdn
        - Key: Project
          Value: kb-mcp
      DistributionConfig:
        Comment: kb-mcp
        Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: alb
            DomainName: !GetAtt Alb.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            Compress: true
          - PathPattern: /mcp*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            Compress: true
          - PathPattern: /static/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true

  # --------------------------------------------------------------- Monitoring
  # No CloudWatch Logs group: the sandbox instance role cannot write to CloudWatch
  # Logs, so the container logs stay on the instance (deviation 8).
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: kb-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail
      Tags:
        - Key: Project
          Value: kb-mcp

  # Runbook: docs/ALARMS.md. Only PublishesMetrics alarms need custom metrics.
  # Search metrics come from kb/metrics.py: namespace KbMcp, dimension Mode
  # (semantic or keyword), metrics LatencyMs, ConfidenceLevel, KeywordSearches.
  # tests/test_infra.py checks that the alarms below use exactly those names.

  # The demo (step 7) turns the fallback toggle on on purpose, so this alarm
  # fires and then recovers during the demo.
  KeywordModeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: PublishesMetrics
    Properties:
      AlarmName: kb-keyword-mode
      AlarmDescription: The app answered at least one search in keyword mode (models failed, timed out or the fallback toggle is on). Fires on purpose in demo step 7.
      Namespace: KbMcp
      MetricName: KeywordSearches
      Dimensions:
        - Name: Mode
          Value: keyword
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # Fires during the failover demo (step 8) when the instance is terminated.
  UnhealthyHostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kb-unhealthy-host
      AlarmDescription: The ALB sees an unhealthy target for 2 minutes. Fires on purpose in the failover demo (step 8) while the instance is replaced.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
        - Name: LoadBalancer
          Value: !GetAtt Alb.LoadBalancerFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # Missing data counts as breaching: with no target registered the ALB
  # publishes nothing, which is exactly the outage this alarm is for. Also
  # fires during the failover demo (step 8) once the old target is gone.
  NoHealthyHostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kb-no-healthy-host
      AlarmDescription: No healthy target behind the ALB for 3 minutes. Fires on purpose in the failover demo (step 8) while the instance is replaced.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
        - Name: LoadBalancer
          Value: !GetAtt Alb.LoadBalancerFullName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kb-5xx
      AlarmDescription: The app returned 5 or more 5xx responses in 5 minutes.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt Alb.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # The EMF line carries LatencyMs only under the Mode dimension, so there is
  # no metric without a dimension. Semantic search is what the model latency
  # budget is about; slow keyword answers show up in kb-keyword-mode.
  HighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: PublishesMetrics
    Properties:
      AlarmName: kb-high-latency
      AlarmDescription: The 90th percentile of semantic search latency is above 2000 ms over 5 minutes. No data (no searches) counts as fine.
      Namespace: KbMcp
      MetricName: LatencyMs
      Dimensions:
        - Name: Mode
          Value: semantic
      ExtendedStatistic: p90
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # Published by the CloudWatch agent on the instance (see user data). The
  # agent aggregates across instances, so the series survives a replacement.
  MemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: PublishesMetrics
    Properties:
      AlarmName: kb-memory
      AlarmDescription: Host memory use averaged above 85 percent for 10 minutes.
      Namespace: CWAgent
      MetricName: mem_used_percent
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref AppAsg
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # 5xx from the ALB itself (502, 503, 504); kb-5xx counts only target 5xx.
  Elb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kb-elb-5xx
      AlarmDescription: The load balancer itself answered 5 or more 5xx (502, 503, 504) in 5 minutes. Targets dropped connections, timed out, or none was healthy.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt Alb.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # Seconds, published by the ALB. Searches wait at most KB_SEARCH_TIMEOUT (5 s).
  ResponseTimeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kb-response-time
      AlarmDescription: The 90th percentile of target response time is above 6 seconds for 10 minutes (two 5 minute periods).
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt Alb.LoadBalancerFullName
      ExtendedStatistic: p90
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 6
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # Basic EC2 metric, averaged over the group (what target tracking also reads).
  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kb-cpu
      AlarmDescription: Average instance CPU above 85 percent for 15 minutes. In postgres mode the group should be scaling out; at 4 instances it cannot.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref AppAsg
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # Desired minus in service; a new instance needs 3 to 10 minutes to be healthy.
  CapacityShortAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kb-capacity-short
      AlarmDescription: Fewer instances in service than desired for 15 minutes. Launches or health checks are failing.
      Metrics:
        - Id: desired
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/AutoScaling
              MetricName: GroupDesiredCapacity
              Dimensions:
                - Name: AutoScalingGroupName
                  Value: !Ref AppAsg
            Period: 60
            Stat: Maximum
        - Id: inservice
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/AutoScaling
              MetricName: GroupInServiceInstances
              Dimensions:
                - Name: AutoScalingGroupName
                  Value: !Ref AppAsg
            Period: 60
            Stat: Minimum
        - Id: shortfall
          Label: Desired minus in service
          Expression: desired - inservice
          ReturnData: true
      EvaluationPeriods: 15
      DatapointsToAlarm: 15
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # RDS publishes every minute, so missing data shows as INSUFFICIENT_DATA, not OK.
  DbCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: UsePostgres
    Properties:
      AlarmName: kb-db-cpu
      AlarmDescription: RDS CPU above 80 percent for 15 minutes. db.t3.micro is burstable; sustained load drains its CPU credits.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !ImportValue kb-DbInstanceId
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # db.t3.micro allows roughly 80 to 110; the app uses at most 6 per instance.
  DbConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: UsePostgres
    Properties:
      AlarmName: kb-db-connections
      AlarmDescription: More than 60 database connections for 10 minutes (the app needs about 6 per instance, at most 24).
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !ImportValue kb-DbInstanceId
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 60
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  DbStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: UsePostgres
    Properties:
      AlarmName: kb-db-storage
      AlarmDescription: Less than 2 GB of free database storage (of 20 GB) for 10 minutes.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !ImportValue kb-DbInstanceId
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # kb-mcp: AWS metrics only. kb-mcp-db: RDS. kb-mcp-search: custom metrics.
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: kb-mcp
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {
                "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
                "properties": {
                  "title": "Requests and 5xx per minute", "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
                  "metrics": [
                    ["AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${AlbName}", {"stat": "Sum", "label": "requests"}],
                    ["AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "LoadBalancer", "${AlbName}", {"stat": "Sum", "label": "target 5xx"}],
                    ["AWS/ApplicationELB", "HTTPCode_ELB_5XX_Count", "LoadBalancer", "${AlbName}", {"stat": "Sum", "label": "load balancer 5xx"}]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
                "properties": {
                  "title": "Target response time (seconds)", "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
                  "metrics": [
                    ["AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${AlbName}", {"stat": "p50", "label": "p50"}],
                    ["AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${AlbName}", {"stat": "p90", "label": "p90"}]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
                "properties": {
                  "title": "Healthy and unhealthy hosts", "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
                  "metrics": [
                    ["AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${TgName}", "LoadBalancer", "${AlbName}", {"stat": "Minimum", "label": "healthy"}],
                    ["AWS/ApplicationELB", "UnHealthyHostCount", "TargetGroup", "${TgName}", "LoadBalancer", "${AlbName}", {"stat": "Maximum", "label": "unhealthy"}]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
                "properties": {
                  "title": "Instances and CPU", "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
                  "metrics": [
                    ["AWS/AutoScaling", "GroupDesiredCapacity", "AutoScalingGroupName", "${AsgName}", {"stat": "Maximum", "label": "desired"}],
                    ["AWS/AutoScaling", "GroupInServiceInstances", "AutoScalingGroupName", "${AsgName}", {"stat": "Minimum", "label": "in service"}],
                    ["AWS/EC2", "CPUUtilization", "AutoScalingGroupName", "${AsgName}", {"stat": "Average", "label": "CPU percent (average)", "yAxis": "right"}]
                  ]
                }
              }
            ]
          }
        - TgName: !GetAtt TargetGroup.TargetGroupFullName
          AlbName: !GetAtt Alb.LoadBalancerFullName
          AsgName: !Ref AppAsg

  DbDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: UsePostgres
    Properties:
      DashboardName: kb-mcp-db
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {
                "type": "metric", "x": 0, "y": 0, "width": 8, "height": 6,
                "properties": {
                  "title": "RDS CPU (percent)", "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
                  "metrics": [["AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${DbId}", {"stat": "Average"}]]
                }
              },
              {
                "type": "metric", "x": 8, "y": 0, "width": 8, "height": 6,
                "properties": {
                  "title": "RDS connections", "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
                  "metrics": [["AWS/RDS", "DatabaseConnections", "DBInstanceIdentifier", "${DbId}", {"stat": "Maximum"}]]
                }
              },
              {
                "type": "metric", "x": 16, "y": 0, "width": 8, "height": 6,
                "properties": {
                  "title": "RDS free storage (bytes)", "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                  "metrics": [["AWS/RDS", "FreeStorageSpace", "DBInstanceIdentifier", "${DbId}", {"stat": "Minimum"}]]
                }
              }
            ]
          }
        - DbId: !ImportValue kb-DbInstanceId

  SearchDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: PublishesMetrics
    Properties:
      DashboardName: kb-mcp-search
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {
                "type": "metric", "x": 0, "y": 0, "width": 8, "height": 6,
                "properties": {
                  "title": "Search latency (p90, ms)", "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
                  "metrics": [
                    ["KbMcp", "LatencyMs", "Mode", "semantic", {"stat": "p90", "label": "semantic"}],
                    ["KbMcp", "LatencyMs", "Mode", "keyword", {"stat": "p90", "label": "keyword"}]
                  ]
                }
              },
              {
                "type": "metric", "x": 8, "y": 0, "width": 8, "height": 6,
                "properties": {
                  "title": "Searches per minute by mode", "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
                  "metrics": [
                    ["KbMcp", "LatencyMs", "Mode", "semantic", {"stat": "SampleCount", "label": "semantic"}],
                    ["KbMcp", "LatencyMs", "Mode", "keyword", {"stat": "SampleCount", "label": "keyword"}]
                  ]
                }
              },
              {
                "type": "metric", "x": 16, "y": 0, "width": 8, "height": 6,
                "properties": {
                  "title": "Memory used (percent)", "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                  "metrics": [["CWAgent", "mem_used_percent", "AutoScalingGroupName", "${AsgName}", {"stat": "Average"}]]
                }
              }
            ]
          }
        - AsgName: !Ref AppAsg

  # ----------------------------------------------------------- Launch template
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Name: !Ref InstanceProfileName
        # IMDSv2 is required. The hop limit is 2 (not 1) because the container
        # sits behind the Docker bridge and needs the instance role for S3
        # (deviation 1 in docs/PROGRESS.md). The SSRF guard in ingest_url blocks
        # 169.254.169.254 for user-supplied URLs.
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: false
            # PostgreSQL mode: kb-DbClientSg is the only source the database accepts.
            Groups: !If
              - UsePostgres
              - - !Ref AppSg
                - !ImportValue kb-DbClientSg
              - - !Ref AppSg
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 30
              VolumeType: gp2  # sandbox allows gp2 only, up to 35 GB
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: kb-app
              - Key: Project
                Value: kb-mcp
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: kb-app
              - Key: Project
                Value: kb-mcp
        # Inline user data (deviation 2 in docs/PROGRESS.md). Inside Fn::Sub a
        # literal shell brace expression must be written with an exclamation mark
        # after the dollar and open brace; plain $VAR needs no escaping.
        # The Sub variables are: Bucket and PublicHost (map below), ImageTag, MetricsMode,
        # ExtensionOrigin and DatabaseMode (parameters), AWS::Region and AWS::StackName
        # (pseudo parameters).
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              set -euxo pipefail
              exec > >(tee -a /var/log/kb-bootstrap.log) 2>&1

              # Report the outcome to CloudFormation on every exit path. STATUS only
              # becomes 0 once /healthz answers, so any earlier failure (set -e,
              # explicit exit, a failed restore) signals failure and the stack rolls back
              # without waiting for the 15 minute creation timeout.
              # On failure the boot log and the container log are copied to
              # s3://<bucket>/debug/ first: the sandbox role allows neither CloudWatch
              # Logs nor Session Manager, so S3 is the only way to read them.
              # Neither log holds a secret (the write tokens never pass through here).
              STATUS=1
              INSTANCE_ID=""
              signal_stack() {
                local id_args=()
                if [ -n "$INSTANCE_ID" ]; then
                  id_args=(--id "$INSTANCE_ID")
                fi
                if [ "$STATUS" -ne 0 ]; then
                  local debug
                  debug="s3://${Bucket}/debug/${!INSTANCE_ID:-unknown}-$(date -u +%Y%m%dT%H%M%SZ)"
                  docker logs --tail 500 kb > /var/log/kb-container.log 2>&1 || true
                  aws s3 cp /var/log/kb-bootstrap.log "$debug-bootstrap.log" --region ${AWS::Region} || true
                  aws s3 cp /var/log/kb-container.log "$debug-container.log" --region ${AWS::Region} || true
                fi
                /opt/aws/bin/cfn-signal -e "$STATUS" "${!id_args[@]}" \
                  --stack ${AWS::StackName} --resource AppAsg --region ${AWS::Region} || true
              }
              trap signal_stack EXIT

              # retry ATTEMPTS DELAY_SECONDS COMMAND...
              retry() {
                local attempts=$1 delay=$2 n=1
                shift 2
                until "$@"; do
                  if [ "$n" -ge "$attempts" ]; then
                    return 1
                  fi
                  n=$((n + 1))
                  sleep "$delay"
                done
              }

              # Read one IMDSv2 metadata path. Tracing is off inside so the session
              # token never reaches the log.
              imds() {
                set +x
                local token
                token=$(curl -sf -X PUT http://169.254.169.254/latest/api/token \
                  -H 'X-aws-ec2-metadata-token-ttl-seconds: 120')
                curl -sf -H "X-aws-ec2-metadata-token: $token" \
                  "http://169.254.169.254/latest/meta-data/$1"
              }

              # 1. Packages and services. The NAT route can lag the first boot, so retry.
              retry 5 15 dnf install -y docker aws-cfn-bootstrap cronie amazon-cloudwatch-agent
              systemctl enable --now docker crond
              INSTANCE_ID=$(retry 5 3 imds instance-id)

              # 2. The database lives on this instance's root volume (kb/snapshot.py
              # uploads it to S3 after every write). /data is a plain directory owned
              # by the container user. It survives a reboot with the volume; a
              # replacement instance starts empty and restores in step 4.
              mkdir -p /data
              chown 10001:10001 /data

              # 3. Fetch the image from S3 with the instance role (the sandbox has
              # no ECR). The download goes through the S3 gateway endpoint, not the
              # NAT. It is streamed, so no tarball lands on disk. pipefail makes a
              # truncated download fail the load, and the retry starts over.
              IMAGE="kb-mcp:${ImageTag}"
              IMAGE_URI="s3://${Bucket}/images/kb-mcp-${ImageTag}.tar.gz"
              load_image() {
                aws s3 cp "$IMAGE_URI" - --region ${AWS::Region} | gunzip -c | docker load
              }
              retry 5 10 load_image
              docker image inspect "$IMAGE" > /dev/null

              # 4. The database before the app starts.
              # sqlite: restore the file from the snapshot (snapshots/kb-latest.db.gz),
              # else the newest nightly backup, else nothing (exit 0, the app creates an
              # empty database). If S3 cannot be read this fails and the boot fails:
              # starting empty would let the first write overwrite the snapshot of the
              # real data.
              # postgres: the data lives in RDS and outlives this instance, so the only
              # job is the first fill: import the S3 snapshot when the database is empty
              # (--if-empty skips otherwise; no snapshot at all is a quiet no-op; any
              # other failure fails the boot). Nothing is re-embedded.
              DATABASE_MODE=${DatabaseMode}
              restore_db() {
                docker run --rm \
                  -v /data:/data \
                  -e KB_DB=/data/kb.db \
                  -e KB_BUCKET=${Bucket} \
                  -e AWS_REGION=${AWS::Region} \
                  "$IMAGE" \
                  python -m kb.cli restore --latest --force --target /data/kb.db
              }
              import_db() {
                docker run --rm \
                  -e KB_BUCKET=${Bucket} \
                  -e AWS_REGION=${AWS::Region} \
                  -e KB_DATABASE_URL_SOURCE=s3 \
                  "$IMAGE" \
                  python -m kb.cli import-sqlite --from snapshots/kb-latest.db.gz --if-empty
              }
              DB_OPTS=()
              if [ "$DATABASE_MODE" = postgres ]; then
                retry 5 15 import_db
                DB_OPTS=(-e KB_DATABASE_URL_SOURCE=s3)
              else
                retry 5 15 restore_db
              fi

              # CloudWatch agent: host memory and disk metrics (namespace CWAgent),
              # also aggregated per Auto Scaling group for the kb-memory alarm. A
              # failure here is logged but does not stop the app from starting.
              CWA_HOME=/opt/aws/amazon-cloudwatch-agent
              cat > "$CWA_HOME/etc/kb-agent.json" <<'CWA_CONFIG'
              {
                "agent": {"metrics_collection_interval": 60, "run_as_user": "root"},
                "metrics": {
                  "namespace": "CWAgent",
                  "append_dimensions": {
                    "AutoScalingGroupName": "${!aws:AutoScalingGroupName}",
                    "InstanceId": "${!aws:InstanceId}"
                  },
                  "aggregation_dimensions": [["AutoScalingGroupName"]],
                  "metrics_collected": {
                    "mem": {"measurement": ["mem_used_percent"]},
                    "disk": {"measurement": ["disk_used_percent"], "resources": ["/"]}
                  }
                }
              }
              CWA_CONFIG
              "$CWA_HOME/bin/amazon-cloudwatch-agent-ctl" -a fetch-config -m ec2 \
                -c "file:$CWA_HOME/etc/kb-agent.json" -s \
                || echo "cloudwatch agent did not start" >&2

              # Container logs stay on the instance with Docker's local driver,
              # rotated at 5 files of 10 MB (`docker logs kb` reads them). The sandbox
              # role cannot write to CloudWatch Logs (deviation 8, which replaces the
              # CloudWatch Logs driver of deviation 3), so search metrics default to MetricsMode=off.
              LOG_OPTS=(
                --log-driver local
                --log-opt max-size=10m
                --log-opt max-file=5
              )

              # 5. Run the container. The app reads the write tokens itself from
              # s3://<bucket>/config/write-tokens through the instance role
              # (KB_TOKENS_SOURCE=s3, kb/config.py), so no secret appears here. Check
              # the object exists first: without it every write would answer 401.
              if ! retry 3 10 aws s3api head-object --bucket ${Bucket} \
                  --key config/write-tokens --region ${AWS::Region} > /dev/null; then
                echo "s3://${Bucket}/config/write-tokens is missing; see docs/phases/01-network-data-stacks.md step 5" >&2
                exit 1
              fi
              # --stop-timeout 30: docker stop sends SIGTERM and waits up to 30 s,
              # long enough for the lifespan shutdown to upload a last snapshot.
              # KB_PROXY_HOPS=2: CloudFront and the ALB each append one entry to
              # X-Forwarded-For, and the rate limit reads the client from the right
              # (kb/clientip.py). Use 1 if the ALB is ever reached without CloudFront.
              docker run -d --name kb --restart unless-stopped \
                --stop-timeout 30 \
                -p 8000:8000 \
                -v /data:/data \
                -e KB_DB=/data/kb.db \
                -e KB_BUCKET=${Bucket} \
                -e AWS_REGION=${AWS::Region} \
                -e KB_TOKENS_SOURCE=s3 \
                -e KB_METRICS_MODE=${MetricsMode} \
                -e "KB_EXTENSION_ORIGIN=${ExtensionOrigin}" \
                -e KB_PROXY_HOPS=2 \
                -e KB_SEARCH_RATE=${SearchRate} \
                -e KB_PUBLIC_URL=https://${PublicHost} \
                "${!DB_OPTS[@]}" \
                "${!LOG_OPTS[@]}" \
                "$IMAGE"

              # Nightly SQLite backup to s3://<bucket>/backups/ at 07:15 UTC (about
              # 2:15 AM Central). crond was enabled with the packages above. The
              # container has KB_DB and KB_BUCKET; output goes to /var/log/kb-backup.log.
              # In postgres mode the nightly job refreshes the portable SQLite snapshot
              # instead (RDS keeps its own backups). Every instance has this line;
              # --once-per makes the first to claim the run export and the rest skip.
              if [ "$DATABASE_MODE" = postgres ]; then
                printf '%s\n' \
                  '15 7 * * * root docker exec kb python -m kb.cli export-sqlite --once-per 3600 >> /var/log/kb-backup.log 2>&1' \
                  > /etc/cron.d/kb-backup
              else
                printf '%s\n' \
                  '15 7 * * * root docker exec kb python -m kb.cli backup >> /var/log/kb-backup.log 2>&1' \
                  > /etc/cron.d/kb-backup
              fi
              chmod 0644 /etc/cron.d/kb-backup

              # 6. Wait up to 10 minutes for the app, then let the EXIT trap send the
              # signal (0 on success, 1 on timeout).
              deadline=$((SECONDS + 600))
              while [ "$SECONDS" -lt "$deadline" ]; do
                if curl -sf http://localhost:8000/healthz > /dev/null; then
                  STATUS=0
                  break
                fi
                sleep 5
              done
              if [ "$STATUS" -ne 0 ]; then
                echo "app did not become healthy within 10 minutes" >&2
                docker logs --tail 100 kb || true
                exit 1
              fi
            - Bucket: !ImportValue kb-BucketName
              # The CloudFront domain, so upload links (kb/uploads.py) point where
              # clients can reach. The ALB itself only accepts CloudFront traffic.
              PublicHost: !GetAtt Distribution.DomainName

  # --------------------------------------------------------- Auto Scaling group
  # The size depends on DatabaseMode (Mappings: Capacity). sqlite: exactly 1
  # instance, because the vector index lives in process memory and SQLite has a
  # single writer; a replacement restores the database from the S3 snapshot.
  # postgres: 2 to 4 instances, any of which can answer any request (data, vectors,
  # upload tickets and the fallback toggle are in RDS), spread over both private
  # subnets, scaling on average CPU (AppScalingPolicy). Never above 4: the sandbox
  # suspends the account past 9 instances. A rolling update replaces one instance at
  # a time and keeps MinInstancesInService serving (sqlite: 0, so a deploy takes the
  # service down briefly; postgres: 1). The image tag is part of the user data, so a
  # new ImageTag creates a new launch template version and triggers the update.
  AppAsg:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - PrivateDefaultRoute
      - Listener
    CreationPolicy:
      ResourceSignal:
        Count: !FindInMap [Capacity, !Ref DatabaseMode, Signals]
        Timeout: PT15M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: !FindInMap [Capacity, !Ref DatabaseMode, InService]
        MaxBatchSize: 1
        WaitOnResourceSignals: true
        PauseTime: PT15M
    Properties:
      MinSize: !FindInMap [Capacity, !Ref DatabaseMode, Min]
      MaxSize: !FindInMap [Capacity, !Ref DatabaseMode, Max]
      DesiredCapacity: !FindInMap [Capacity, !Ref DatabaseMode, Desired]
      # Group metrics are free at 1 minute; kb-capacity-short and kb-capacity-max read them.
      MetricsCollection:
        - Granularity: 1Minute
          Metrics:
            - GroupInServiceInstances
            - GroupDesiredCapacity
      VPCZoneIdentifier:
        - !ImportValue kb-PrivateSubnetA
        - !ImportValue kb-PrivateSubnetB
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      TargetGroupARNs:
        - !Ref TargetGroup
      HealthCheckType: ELB
      # Boot order is packages, image download and load (S3), database restore,
      # then the app (model load and index build), all before /healthz answers.
      # Expected to take a few minutes (not measured yet); 600 s leaves room. The restore finishes before
      # the app starts, so the app never serves a half restored database.
      HealthCheckGracePeriod: 600
      Tags:
        - Key: Name
          Value: kb-app
          PropagateAtLaunch: true
        - Key: Project
          Value: kb-mcp
          PropagateAtLaunch: true

  # Scale on average CPU across the group (a basic EC2 metric, so it needs no
  # instance role permissions). The warmup covers image load plus model load.
  AppScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Condition: UsePostgres
    Properties:
      AutoScalingGroupName: !Ref AppAsg
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 600
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 50

  # Emails when the group has scaled out to its maximum (the demo account has no
  # headroom beyond 4 instances). Needs MetricsCollection on the group.
  CapacityMaxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: UsePostgres
    Properties:
      AlarmName: kb-capacity-max
      AlarmDescription: The Auto Scaling group is running its maximum of 4 instances (CPU stayed above target). Expected during the load test.
      Namespace: AWS/AutoScaling
      MetricName: GroupInServiceInstances
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref AppAsg
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 4
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

Outputs:
  DistributionDomainName:
    Description: CloudFront domain name (use https://<this>/mcp for Claude Code)
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Description: CloudFront distribution ID (aws cloudfront wait distribution-deployed --id <this>)
    Value: !Ref Distribution
  AlertTopicArn:
    Description: SNS topic that receives the alarm emails
    Value: !Ref AlertTopic
  AlbDnsName:
    Description: Public DNS name of the load balancer
    Value: !GetAtt Alb.DNSName
  AsgName:
    Description: Auto Scaling group name
    Value: !Ref AppAsg
  TargetGroupArn:
    Description: Target group ARN
    Value: !Ref TargetGroup
  LoadBalancerFullName:
    Description: Load balancer full name (CloudWatch alarm dimension)
    Value: !GetAtt Alb.LoadBalancerFullName
  TargetGroupFullName:
    Description: Target group full name (CloudWatch alarm dimension)
    Value: !GetAtt TargetGroup.TargetGroupFullName
