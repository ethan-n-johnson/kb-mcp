[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb"
version = "0.1.0"
description = "Knowledge-base MCP server for the Cloud Computing course"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "mcp>=2,<3",
  "fastembed",
  "numpy",
  "trafilatura>=2.0",
  "pymupdf4llm",
  "httpx",
  "jinja2",
  "nh3",
  "slowapi",
  "boto3",
  "pyyaml",
  "markdown-it-py",
  "python-multipart",
  "psycopg[binary]",
  "psycopg-pool",
  "pgvector",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "moto[s3,ssm]",
  "cfn-lint",
]

[tool.setuptools.packages.find]
include = ["kb*"]

[tool.setuptools.package-data]
kb = ["templates/*", "static/*", "store/*.sql"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Only rules that catch real bugs (syntax errors, undefined names, unused imports).
# Style rules are off on purpose: widen this list only after fixing what they flag.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported from other test modules and then used as arguments,
# which ruff reads as a redefinition.
"tests/*" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not models'"
markers = [
  "models: loads real ONNX models (slow, needs the model cache)",
  "pg: runs against PostgreSQL (needs KB_TEST_DATABASE_URL, otherwise skipped)",
]
