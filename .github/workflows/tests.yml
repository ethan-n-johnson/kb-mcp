name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The job names below (ruff, pytest, cfn-lint) are the check names that branch
# protection requires. Renaming a job means updating the rule too.
jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Lint with ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.8"
          args: "check --output-format=github"

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # Fast tests only: pyproject.toml deselects the "models" marker, so no
      # ONNX models are downloaded. The tests set fake AWS credentials and use
      # moto, so nothing here reaches a real AWS account.
      - name: Run fast tests
        run: pytest -q

  cfn-lint:
    name: cfn-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint the CloudFormation templates
        run: |
          pip install cfn-lint
          cfn-lint infra/*.yaml